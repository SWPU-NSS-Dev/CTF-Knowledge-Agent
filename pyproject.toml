[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ctf-knowledge-agent"
version = "0.1.0"
description = "Local-first CTF knowledge collection and offline search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx[socks]>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "markdown-it-py>=3,<5",
  "markdownify>=0.13,<2",
  "typer>=0.12,<1",
  "feedparser>=6.0,<7",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
ctfka = "ctfka.cli.main:app"

[project.entry-points."ctfka.sources"]

[tool.hatch.build.targets.wheel]
packages = ["ctfka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"ctfka/cli/main.py" = ["B008"]
